name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  quality:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze

      - name: Tests (logic, database, widgets, screenshots)
        run: flutter test --concurrency=1

  android:
    name: Build APK
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The release key never lives in the repository. The workflow reconstructs
      # it from four secrets; if they are missing the build still runs, but with
      # the debug key, which no future release can upgrade over the top of.
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.TAKA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.TAKA_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TAKA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TAKA_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning title=Unsigned::TAKA_KEYSTORE_BASE64 is not set — this APK is signed with the debug key and must not be released."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/taka-release.jks
          {
            echo "storeFile=app/taka-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          echo "Release keystore restored."

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.${GITHUB_RUN_NUMBER}.0" >> "$GITHUB_OUTPUT"
          fi
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      # Signed with the repository's release key when the four TAKA_* secrets
      # are set (the keystore is written just above, never committed), otherwise
      # with the debug key so every push still produces an installable APK.
      #
      # Every APK here now carries the same signature, which is what makes an
      # in-place update possible: Android refuses to install over an app signed
      # by someone else. The version code rises with every run, so the phone
      # accepts it as an update and keeps its database.
      #
      # --split-per-abi matters for size: one universal APK carries three CPU
      # builds (arm64 + arm32 + x86), which is most of the download. Split, each
      # APK is a fraction of that and identical in features and UI.
      # --split-debug-info keeps the DWARF data out of the shipped binary (it is
      # uploaded as its own artifact, so crash reports stay readable) and the
      # obfuscated symbol names cost nothing in features or UI.
      - name: Build release APKs (one per CPU)
        env:
          TAKA_STORE_PASSWORD: ${{ secrets.TAKA_STORE_PASSWORD }}
          TAKA_KEY_ALIAS: ${{ secrets.TAKA_KEY_ALIAS }}
          TAKA_KEY_PASSWORD: ${{ secrets.TAKA_KEY_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi \
            --build-name ${{ steps.version.outputs.name }} \
            --build-number ${{ steps.version.outputs.code }} \
            --obfuscate --split-debug-info=build/symbols

      - name: Build app bundle
        env:
          TAKA_STORE_PASSWORD: ${{ secrets.TAKA_STORE_PASSWORD }}
          TAKA_KEY_ALIAS: ${{ secrets.TAKA_KEY_ALIAS }}
          TAKA_KEY_PASSWORD: ${{ secrets.TAKA_KEY_PASSWORD }}
        run: |
          flutter build appbundle --release \
            --build-name ${{ steps.version.outputs.name }} \
            --build-number ${{ steps.version.outputs.code }} \
            --obfuscate --split-debug-info=build/symbols

      - name: Verify every APK carries the same signature
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "using $APKSIGNER"
          APKS=$(ls build/app/outputs/flutter-apk/app-*-release.apk)
          for apk in $APKS; do
            echo "$apk"
            "$APKSIGNER" verify --print-certs "$apk" \
              | grep -E "Signer #1 certificate (DN|SHA-256)" || true
          done
          # Every ABI must agree, or two phones get two different apps.
          COUNT=$(for apk in $APKS; do
            "$APKSIGNER" verify --print-certs "$apk" \
              | grep "certificate SHA-256" | head -1
          done | sort -u | wc -l)
          echo "distinct signer fingerprints: $COUNT"
          test "$COUNT" -le 1

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          V=${{ steps.version.outputs.name }}
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   artifacts/taka-$V-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk artifacts/taka-$V-arm32.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk      artifacts/taka-$V-x86_64.apk
          cp build/app/outputs/bundle/release/app-release.aab          artifacts/taka-$V.aab
          ls -lh artifacts

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: taka-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: taka-aab
          path: artifacts/*.aab
          if-no-files-found: error
          retention-days: 30

      # Needed to symbolicate a crash report from an obfuscated build.
      - name: Upload symbol files
        uses: actions/upload-artifact@v4
        with:
          name: taka-symbols
          path: build/symbols
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Taka ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/*.apk
            artifacts/*.aab
          body: |
            **Taka · টাকা** — offline personal expense tracker for hall life.

            **Which file do I want?** `taka-<version>-arm64.apk` for any phone made
            since ~2016. `arm32` only for something very old. The `.aab` is for
            publishing, not for installing by hand.

            Install the APK on an Android phone (allow "install from unknown sources").
            Data stays on the device: no account, no cloud.
