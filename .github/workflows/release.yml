name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  quality:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze

      - name: Tests (logic, database, widgets, screenshots)
        run: flutter test --concurrency=1

  android:
    name: Build APK
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.${GITHUB_RUN_NUMBER}.0" >> "$GITHUB_OUTPUT"
          fi
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      # Signed with the debug key so every push produces an installable APK.
      # Add a keystore + key.properties as secrets to ship a proper release key.
      #
      # --split-per-abi matters for size: one universal APK carries three CPU
      # builds (arm64 + arm32 + x86), which is most of the download. Split, each
      # APK is a fraction of that and identical in features and UI.
      - name: Build release APKs (one per CPU)
        run: |
          flutter build apk --release --split-per-abi \
            --build-name ${{ steps.version.outputs.name }} \
            --build-number ${{ steps.version.outputs.code }}

      - name: Build app bundle
        run: |
          flutter build appbundle --release \
            --build-name ${{ steps.version.outputs.name }} \
            --build-number ${{ steps.version.outputs.code }}

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          V=${{ steps.version.outputs.name }}
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   artifacts/taka-$V-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk artifacts/taka-$V-arm32.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk      artifacts/taka-$V-x86_64.apk
          cp build/app/outputs/bundle/release/app-release.aab          artifacts/taka-$V.aab
          ls -lh artifacts

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: taka-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: taka-aab
          path: artifacts/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Taka ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/*.apk
            artifacts/*.aab
          body: |
            **Taka · টাকা** — offline personal expense tracker for hall life.

            **Which file do I want?** `taka-<version>-arm64.apk` for any phone made
            since ~2016. `arm32` only for something very old. The `.aab` is for
            publishing, not for installing by hand.

            Install the APK on an Android phone (allow "install from unknown sources").
            Data stays on the device: no account, no cloud.
